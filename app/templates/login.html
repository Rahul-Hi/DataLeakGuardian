<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Data Leak Guardian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="container page-container py-4 py-md-5">
      {% include "_navigation.html" %}
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <section class="card">
            <div class="card-body p-4 p-md-5">
              <h1 class="page-title h3 mb-2">Log in</h1>
              <p class="text-muted mb-4">Sign in to access your scans.</p>
              {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}<div class="alert alert-{{ category }}" role="alert">{{ message }}</div>{% endfor %}
              {% endwith %}
              <form method="post" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                  <label for="email" class="form-label fw-semibold">Email</label>
                  <input class="form-control" type="email" id="email" name="email" autocomplete="email" required maxlength="254" value="{{ request.form.get('email', '') }}">
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label fw-semibold">Password</label>
                  <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Log in</button>
              </form>
              <p class="text-muted small mt-4 mb-0">New here? <a href="{{ url_for('web.register') }}">Create an account</a></p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
